  .attachment-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--info-soft); color: var(--primary-dark); padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

</style>

function exportCSV(filename, rows) {
  const csv = rows.map(r => r.map(cell => { const s = String(cell??""); if (s.includes(",")||s.includes('"')||s.includes("\n")) return '"'+s.replace(/"/g,'""')+'"'; return s; }).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast("✓ Descarga: " + filename);
}

function agruparPorHospital_fin() {
  const facts = state.facturas.filter(f => f.financiador === "F001" && isImpaga(f));
  const g = {};
  facts.forEach(f => {
    if (!g[f.hospital]) g[f.hospital] = { count:0, deudaTotal:0, aceptadoSinPagar:0, saldoParcial:0, espYo:0, espHosp:0, porVencer:0, vencidas:0 };
    const d = g[f.hospital]; d.count++; d.deudaTotal += saldoPendiente(f);
    if (f.estado === "aceptada") d.aceptadoSinPagar += saldoPendiente(f);
    if (f.estado === "pago_parcial") d.saldoParcial += saldoPendiente(f);
    if (esDiscYo_fin(f)) d.espYo++;
    if (esDiscHosp_fin(f)) d.espHosp++;
    if (f.estado === "morosa") d.vencidas++;
    const dias = diasRestantes(f.fecha);
    if (dias > 0 && dias <= 15 && f.estado !== "morosa") d.porVencer++;
  });
  return g;
}
function kpisFinanciador() {
  const facts = state.facturas.filter(f => f.financiador === "F001" && isImpaga(f));
  const k = { deudaTotal:0, sinPagar:0, sinPagarMonto:0, pagoParcial:0, pagoParcialSaldo:0, porVencer:0, porVencerMonto:0, vencidas:0, vencidasMonto:0, espYo:0, espYoMonto:0, espHosp:0, espHospMonto:0, total: facts.length };
  facts.forEach(f => {
    const s = saldoPendiente(f); k.deudaTotal += s;
    if (f.estado !== "pago_parcial") { k.sinPagar++; k.sinPagarMonto += s; }
    if (f.estado === "pago_parcial") { k.pagoParcial++; k.pagoParcialSaldo += s; }
    if (esDiscYo_fin(f)) { k.espYo++; k.espYoMonto += (f.montoDebate || s); }
    if (esDiscHosp_fin(f)) { k.espHosp++; k.espHospMonto += (f.montoDebate || s); }
    if (f.estado === "morosa") { k.vencidas++; k.vencidasMonto += s; }
    const dias = diasRestantes(f.fecha);
    if (dias > 0 && dias <= 15 && f.estado !== "morosa") { k.porVencer++; k.porVencerMonto += s; }
  });
  return k;
}

          if (sub.view === "disc_esperan_yo" && kFin.espYo > 0) badge = `<span class="badge">${kFin.espYo}</span>`;

/* ========================================================= VISTAS MINISTERIO ========================================================= */
/* ---- Agregaciones globales del ministerio (todo el sistema, todos los financiadores) ---- */
function kpisMinisterio() {
  const activas = state.facturas.filter(f => isImpaga(f));
  const k = { enCola:0, enColaMonto:0, notificado:0, notificadoMonto:0, deudaTotal:0,
    aceptado:0, aceptadoMonto:0, espFin:0, espFinMonto:0, espHosp:0, espHospMonto:0,
    porVencer:0, porVencerMonto:0, morosas:0, morosasMonto:0, total: activas.length };
  activas.forEach(f => {
    const s = saldoPendiente(f);
    if (f.estado === "en_cola") { k.enCola++; k.enColaMonto += s; }
    else { k.deudaTotal += s; }
    if (f.estado !== "en_cola") { k.notificado++; k.notificadoMonto += s; }
    if (f.estado === "aceptada") { k.aceptado++; k.aceptadoMonto += s; }
    // desde la óptica del ministerio: esperando_financiador = pelota del financiador; esperando_hospital = pelota del hospital
    if (f.estado === "esperando_financiador") { k.espFin++; k.espFinMonto += (f.montoDebate || s); }
    if (f.estado === "esperando_hospital") { k.espHosp++; k.espHospMonto += (f.montoDebate || s); }
    if (f.estado === "morosa") { k.morosas++; k.morosasMonto += s; }
    const dias = diasRestantes(f.fecha);
    if (dias > 0 && dias <= 15 && f.estado !== "morosa" && f.estado !== "en_cola") { k.porVencer++; k.porVencerMonto += s; }
  });
  return k;
}
function agruparMinisterioPor(dim) { // dim = "financiador" | "hospital"
  const activas = state.facturas.filter(f => isImpaga(f) && f.estado !== "en_cola");
  const g = {};
  activas.forEach(f => {
    const key = f[dim];
    if (!g[key]) g[key] = { count:0, deuda:0, aceptado:0, espFin:0, espHosp:0, porVencer:0, morosas:0 };
    const d = g[key]; const s = saldoPendiente(f);
    d.count++; d.deuda += s;
    if (f.estado === "aceptada") d.aceptado += s;
    if (f.estado === "esperando_financiador") d.espFin++;
    if (f.estado === "esperando_hospital") d.espHosp++;
    if (f.estado === "morosa") d.morosas++;
    const dias = diasRestantes(f.fecha);
    if (dias > 0 && dias <= 15 && f.estado !== "morosa") d.porVencer++;
  });
  return g;
}

}
window.exportMinNotificadas = function() {
  const n = state.facturas.filter(f => f.estado !== "en_cola");
  const rows = [["Factura","Hospital","Financiador","Emisión","Días","Estado","Monto"]];
  n.forEach(f => rows.push([f.nro, hospNombre(f.hospital), finNombre(f.financiador), f.fecha, diasRestantes(f.fecha), f.estado, f.monto]));
  exportCSV("facturas_notificadas.csv", rows);
};
function viewMinisterio_Discusiones() {
  const facts = state.facturas.filter(f => esDiscYo_fin(f) || esDiscHosp_fin(f));
  const espFin = facts.filter(f => f.estado === "esperando_financiador");
  const espHosp = facts.filter(f => f.estado === "esperando_hospital");
  const fila = (f) => {
    const t = state.threads[f.nro] || []; const last = t[t.length-1];
    const pelota = f.estado === "esperando_financiador" ? '<span class="chip chip-esperando-hospital">Financiador</span>' : '<span class="chip chip-esperando-financiador">Hospital</span>';
    return `<tr><td><code>${f.nro}</code></td><td>${hospCorto(f.hospital)}</td><td>${finNombre(f.financiador)}</td><td>${pelota}</td><td class="money" style="color:var(--warn);font-weight:600;">${money(f.montoDebate||0)}</td><td style="color:${diasRestantes(f.fecha)<15?'var(--danger)':'var(--muted)'};font-weight:600;">${diasRestantes(f.fecha)}</td><td style="font-size:12px;color:var(--muted);">${last ? last.nombre+' — '+last.when : '—'}</td></tr>`;
  };
  return `<div class="page-header">
      <div><h1>Discusiones abiertas</h1><div class="sub">Todas las discusiones del sistema y quién debe actuar</div></div>
      <button class="btn btn-excel" onclick="exportMinDiscusiones()">⬇ Excel</button>
    </div>
    <div class="note note-blue"><strong>Decisión abierta:</strong> el rol del ministerio acá (observador / auditor / mediador) todavía está por definir. El prototipo asume que puede ver todo y, eventualmente, intervenir.</div>
    <div class="kpi-grid">
      <div class="kpi warning"><div class="label">Esperando al financiador</div><div class="value warn">${espFin.length}</div><div class="hint money">${money(espFin.reduce((s,f)=>s+(f.montoDebate||0),0))}</div></div>
      <div class="kpi good"><div class="label">Esperando al hospital</div><div class="value success">${espHosp.length}</div><div class="hint money">${money(espHosp.reduce((s,f)=>s+(f.montoDebate||0),0))}</div></div>
      <div class="kpi"><div class="label">Total en debate</div><div class="value money">${money(facts.reduce((s,f)=>s+(f.montoDebate||0),0))}</div></div>
    </div>
    <div class="card" style="padding:0;"><table>
      <thead><tr><th>Factura</th><th>Hospital</th><th>Financiador</th><th>Pelota en</th><th class="money-header">En debate</th><th>Días</th><th>Últ. mensaje</th></tr></thead>
      <tbody>${facts.map(fila).join('')}</tbody>
    </table></div>`;
}
window.exportMinDiscusiones = function() {
  const facts = state.facturas.filter(f => esDiscYo_fin(f) || esDiscHosp_fin(f));
  const rows = [["Factura","Hospital","Financiador","Pelota en","En debate","Días"]];
  facts.forEach(f => rows.push([f.nro, hospNombre(f.hospital), finNombre(f.financiador), f.estado === "esperando_financiador" ? "Financiador" : "Hospital", f.montoDebate||0, diasRestantes(f.fecha)]));

window.exportMinMorosidad = function() {

/* ========================================================= ROUTER ========================================================= */
function render() {
  renderSidebar();
  const main = $("#main"); const role = state.role; const view = state.view;
  let html = "";
  if (role === "ministerio") {
    if (view === "dashboard") html = viewMinisterio_Dashboard();
    else if (view === "cola") html = viewMinisterio_Cola();
    else if (view === "notificadas") html = viewMinisterio_Notificadas();
    else if (view === "discusiones") html = viewMinisterio_Discusiones();
    else if (view === "morosidad") html = viewMinisterio_Morosidad();
    else if (view === "min_detalle_fin") html = viewMinisterio_DetalleActor("financiador", state.context.actor);
    else if (view === "min_detalle_hosp") html = viewMinisterio_DetalleActor("hospital", state.context.actor);
  } else if (role === "hospital") {
    if (view === "panel_hospital") html = viewHospital_Panel();
    else if (view === "detalle_financiador") html = viewHospital_DetalleFinanciador(state.context.financiador);
    else if (view === "facturas_hospital") html = viewHospital_Facturas();
    else if (view === "detalle_factura_hosp") html = viewHospital_DetalleFactura(state.context.factura);
    else if (view === "discusiones_hospital" || view === "disc_h_esperan_yo") html = viewHospital_Discusiones("yo");
    else if (view === "disc_h_esperan_fin") html = viewHospital_Discusiones("fin");
    else if (view === "pagos_hospital") html = viewHospital_Pagos();
    else if (view === "cerradas_hospital") html = viewHospital_Cerradas();
  } else if (role === "financiador") {
    if (view === "panel_financiador") html = viewFinanciador_Panel();
    else if (view === "detalle_hospital") html = viewFinanciador_DetalleHospital(state.context.hospital);
    else if (view === "notificaciones") html = viewFinanciador_Notificaciones();
    else if (view === "facturas_financiador") html = viewFinanciador_Facturas();
    else if (view === "detalle_factura") html = viewFinanciador_DetalleFactura(state.context.factura);
    else if (view === "discusiones_financiador" || view === "disc_esperan_yo") html = viewFinanciador_Discusiones("yo");
    else if (view === "disc_esperan_hosp") html = viewFinanciador_Discusiones("hosp");
    else if (view === "informar_pagos") html = viewFinanciador_InformarPagos();
    else if (view === "historial_financiador") html = viewFinanciador_Historial();
  }
  html += `<div class="legend"><h4>Ciclo de vida — estados</h4><div class="legend-items">
    ${chip("emitida")} ${chip("en_cola")} ${chip("notificada")} ${chip("aceptada")}
    ${chip("esperando_financiador")} ${chip("esperando_hospital")}
    ${chip("rechazada_parcial")} ${chip("rechazada_total")}
    ${chip("pago_informado")} ${chip("pago_parcial")} ${chip("pagada")} ${chip("morosa")} ${chip("cerrada")}
  </div></div>`;
  main.innerHTML = html;
  wireEvents();
}

/* ========================================================= EVENTS + MODALES ========================================================= */
function wireEvents() {
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', (e) => { e.preventDefault(); state.view = el.dataset.nav; state.context = {}; render(); }));
  document.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', (e) => { e.preventDefault(); state.view = el.dataset.goto; render(); }));
  document.querySelectorAll('[data-hospital-fin]').forEach(el => el.addEventListener('click', () => { state.view = "detalle_hospital"; state.context.hospital = el.dataset.hospitalFin; render(); }));
  document.querySelectorAll('[data-financiador-hosp]').forEach(el => el.addEventListener('click', () => { state.view = "detalle_financiador"; state.context.financiador = el.dataset.financiadorHosp; render(); }));
  document.querySelectorAll('[data-min-fin]').forEach(el => el.addEventListener('click', () => { state.view = "min_detalle_fin"; state.context.actor = el.dataset.minFin; render(); }));
  document.querySelectorAll('[data-min-hosp]').forEach(el => el.addEventListener('click', () => { state.view = "min_detalle_hosp"; state.context.actor = el.dataset.minHosp; render(); }));
  document.querySelectorAll('[data-open-notif]').forEach(el => el.addEventListener('click', () => { state.view = "facturas_financiador"; render(); }));
  document.querySelectorAll('[data-open-fact-fin]').forEach(el => el.addEventListener('click', () => { state.view = "detalle_factura"; state.context.factura = el.dataset.openFactFin; render(); }));
  document.querySelectorAll('[data-open-fact-hosp]').forEach(el => el.addEventListener('click', () => { state.view = "detalle_factura_hosp"; state.context.factura = el.dataset.openFactHosp; render(); }));
  const bN = $("#btn-notificar"); if (bN) bN.addEventListener('click', () => openModalNotificar());
  const bA = $("#btn-aceptar-total"); if (bA) bA.addEventListener('click', () => { const f = state.facturas.find(x => x.nro === state.context.factura); if (f) f.estado = "aceptada"; render(); showToast("✓ Aceptada"); });
  const bD = $("#btn-discutir"); if (bD) bD.addEventListener('click', () => openModalDiscutirFin());
  const bRP = $("#btn-rechazar-parcial"); if (bRP) bRP.addEventListener('click', () => { const f = state.facturas.find(x => x.nro === state.context.factura); if (f) f.estado = "rechazada_parcial"; render(); });
  const bRT = $("#btn-rechazar-total"); if (bRT) bRT.addEventListener('click', () => { const f = state.facturas.find(x => x.nro === state.context.factura); if (f) f.estado = "rechazada_total"; render(); });
  const bNP = $("#btn-nuevo-pago"); if (bNP) bNP.addEventListener('click', () => openModalNuevoPago());
  document.querySelectorAll('[data-confirmar-pago]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.confirmarPago; const p = state.pagosInformados.find(x => x.id === id);
    if (p) { p.estado = "confirmado"; p.facturas.forEach(nro => { const f = state.facturas.find(x => x.nro === nro); if (f) f.estado = "cerrada"; }); }
    render(); showToast("✓ Pago confirmado — factura cerrada");
  }));
}

function openModal(html) {
  $("#modal-content").innerHTML = html;
  $("#modal-backdrop").classList.add("open");
  $("#modal-backdrop").onclick = (e) => { if (e.target.id === "modal-backdrop") closeModal(); };
  document.querySelectorAll('.cat-item').forEach(item => {
    const cb = item.querySelector('input[type="checkbox"]');
    if (cb) cb.addEventListener('change', () => item.classList.toggle('checked', cb.checked));
  });
}
function closeModal() { $("#modal-backdrop").classList.remove("open"); }
window.closeModal = closeModal;

  const enCola = state.facturas.filter(f => f.estado === "en_cola");

  state.facturas.forEach(f => { if (f.estado === "en_cola") f.estado = "notificada"; });

};

};
