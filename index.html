/* ---- AUDITORÍA CENTRAL (definición 11/8) ----
   Toda objeción del financiador entra acá. La auditoría resuelve directamente (objeción improcedente,
   aportando documentación y devolviendo al financiador) o deriva al hospital (objeción procedente, para
   que emita NC o presente descargo). Si hay varias objeciones en la misma factura y se resuelven con
   criterios distintos, el resultado es una resolución parcial: alcanza con que una se derive para que la
   pelota quede del lado del hospital. El hospital NUNCA recibe la objeción original sin pasar por acá. */
function viewMinisterio_Auditoria() {
  const enAuditoria = state.facturas.filter(f => f.estado === "esperando_auditoria");
  const derivadas = state.facturas.filter(f => f.estado === "esperando_hospital");
  const devueltas = state.facturas.filter(f => f.estado === "esperando_financiador");
  const debate = (f) => montoEnDebate(f) || f.montoDebate || 0;

    const t = state.threads[f.nro] || []; const last = t[t.length-1];
    return `<tr class="clickable" data-open-fact-aud="${f.nro}"><td><code>${f.nro}</code></td><td>${hospCorto(f.hospital)}</td><td>${finNombre(f.financiador)}</td><td>${pelota}</td>
      <td class="money" style="color:var(--warn);font-weight:600;">${money(debate(f))}</td>

    <div class="decision-abierta" style="margin-bottom:16px;"><strong>D2 — a definir:</strong> si la intervención del ministerio <em>suspende</em> el reloj de 60 días o si sigue corriendo. <strong>Hoy el prototipo lo deja correr.</strong> Falta definir además si la auditoría central cuenta como “mediación” a estos efectos, ya que interviene desde el arranque de toda discusión y no solo cuando el caso escala.</div>
    <div class="kpi-grid">
      <div class="kpi ${enAuditoria.length?'action-required':''}"><div class="label">Esperan mi resolución</div><div class="value ${enAuditoria.length?'danger':''}">${enAuditoria.length}</div><div class="hint money">${money(enAuditoria.reduce((s,f)=>s+debate(f),0))}</div></div>
      <div class="kpi warning"><div class="label">Derivadas al hospital</div><div class="value warn">${derivadas.length}</div><div class="hint money">${money(derivadas.reduce((s,f)=>s+debate(f),0))}</div></div>
      <div class="kpi"><div class="label">En manos del financiador</div><div class="value">${devueltas.length}</div><div class="hint money">${money(devueltas.reduce((s,f)=>s+debate(f),0))}</div></div>

    </div>
    <div class="card">
      <h3 class="card-title">Bandeja — objeciones a resolver</h3>
      ${enAuditoria.length === 0 ? `<div style="color:var(--muted);padding:24px;text-align:center;">No hay objeciones esperando resolución.</div>` : `

        <thead><tr><th>Factura</th><th>Hospital</th><th>Financiador</th><th style="text-align:center;">Planteos</th><th class="money-header">En debate</th><th>Días</th><th></th></tr></thead>
        <tbody>${enAuditoria.map(f => {

/* Indicador de morosidad acumulada por par vs. umbral de 6 JUS (brief 3.4).
   Compartido entre Ministerio (con acción de generar expediente) y Hospital (solo lectura). */

  const habilitados = pares.filter(p => p.habilitado).length;
  return `<div class="card">

    </h3>
    <div class="note"><strong>Solo acumulan las facturas ya intimadas que no pagaron</strong>, y solo se puede abrir expediente cuando ese acumulado del par alcanza ${UMBRAL_JUS} JUS.
      Al generar el expediente, esas facturas salen del acumulador y el par vuelve a cero para la próxima tanda — por eso un mismo par puede terminar con varios expedientes.</div>
    ${pares.length === 0 ? `<div style="color:var(--muted);padding:20px;text-align:center;">Ningún par con deuda intimada pendiente de judicializar.</div>` : `
    <table>
      <thead><tr><th>Hospital</th><th>Financiador</th><th style="text-align:center;">Facturas</th><th class="money-header">Deuda intimada acumulada</th><th>Avance hacia ${UMBRAL_JUS} JUS</th><th style="text-align:center;">Estado</th><th style="text-align:center;">Exp. previos</th>${conAccion ? '<th></th>' : ''}</tr></thead>
      <tbody>${pares.map(p => `<tr>
        <td><strong>${hospCorto(p.hospital)}</strong></td>
        <td>${finNombre(p.financiador)}</td>

        <td><div style="font-size:11px;color:var(--muted);">${p.jus.toFixed(2)} / ${UMBRAL_JUS} JUS</div>${barraJus(p.monto)}</td>
        <td style="text-align:center;">${etiquetaJus(p)}</td>
        <td style="text-align:center;">${p.previos > 0 ? `<span class="chip chip-pago-parcial">${p.previos}</span>` : '—'}</td>
        ${conAccion ? `<td style="text-align:right;">${p.habilitado
          ? `<button class="btn btn-danger btn-sm" data-gen-exp="${p.hospital}:${p.financiador}">Generar expediente →</button>`

      </tr>`).join('')}</tbody>
    </table>
    ${conAccion && habilitados > 0 ? `<div class="note" style="margin-top:12px;"><strong>${habilitados} par(es) habilitado(s)</strong> para abrir expediente. La apertura <strong>no es automática</strong>: la decide Legales.</div>` : ''}`}
  </div>`;
}

/* ========================================================= ROUTER ========================================================= */

    else if (view === "notificaciones") html = viewFinanciador_Notificaciones();
    else if (view === "facturas_financiador") html = viewFinanciador_Facturas();
    else if (view === "notas_credito") html = viewFinanciador_NotasCredito();
    else if (view === "detalle_factura") html = viewFinanciador_DetalleFactura(state.context.factura);
    else if (view === "discusiones_financiador" || view === "disc_esperan_yo") html = viewFinanciador_Discusiones("yo");
    else if (view === "disc_esperan_hosp") html = viewFinanciador_Discusiones("hosp");

    ${chip("esperando_auditoria")} ${chip("esperando_hospital")} ${chip("esperando_financiador")}
    ${chip("rechazada_parcial")} ${chip("rechazada_total")}
    ${chip("pago_efectuado")} ${chip("pago_informado")} ${chip("pago_parcial")}
    ${chip("morosa")} ${chip("intimada")} ${chip("judicializada")}
    ${chip("cerrada")} ${chip("cerrada_nc")}
  </div></div>`;

    if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
  }

/* Conecta un grupo de filtros a su objeto en `state`. Los selects reaccionan al cambio;
   los campos de texto filtran mientras se escribe y recuperan el foco tras el re-render. */
function wireFiltros(sel, dsKey, stateKey) {
  document.querySelectorAll(sel).forEach(el => {
    const campo = el.dataset[dsKey];
    const esTexto = el.tagName === "INPUT";
    el.addEventListener(esTexto ? 'input' : 'change', () => {
      state[stateKey][campo] = el.value;
      if (esTexto) state.focusSel = `${sel.slice(0, -1)}="${campo}"]`;
      render();
    });
  });
}

  /* ---- Filtros del panel del financiador ---- */

/* Cableado de las acciones sobre planteos. Vive aparte de wireEvents() porque las mismas acciones
   aparecen en dos lugares: la tarjeta de planteo y el modal de paciente. */
function wireAccionesPlanteo(root = document) {
  // Acotado a `root`: si se cablea con `document` desde el modal, los botones de la pantalla de
  // fondo quedan con listener doble y la acción se dispara dos veces.
  const $$ = (sel) => root.querySelectorAll(sel);
  const buscarPlanteo = (k) => {
    const [nro, objId] = k.split("|");
    const f = state.facturas.find(x => x.nro === nro);
    return { f, o: f && objecionesDe(f).find(x => x.id === objId) };
  };
  /* Qué prestaciones alcanza la acción: las tildadas en la tarjeta, o las que el botón traiga
     acotadas (es el caso del modal de paciente, donde la acción es sobre ese paciente). */
  const idsDeAccion = (el, o) => {
    if (el.dataset.ids) return el.dataset.ids.split(",");
    const tildadas = [...document.querySelectorAll(`[data-sel-prest^="${o.id}|"]:checked`)]
      .map(c => c.dataset.selPrest.split("|")[1]);
    return tildadas.length ? tildadas : o.items.slice();
  };
  $$('[data-aud-desestimar]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.audDesestimar); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o)); openModalAudDesestimar(f, o);
  }));
  $$('[data-aud-derivar]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.audDerivar); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o)); openModalAudDerivar(f, o);
  }));
  $$('[data-aud-razon]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.audRazon); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o)); openModalAudRazon(f, o);
  }));
  $$('[data-hosp-responder]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.hospResponder); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o)); openModalDescargoPlanteo(f, o);
  }));
  $$('[data-hosp-nc]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.hospNc); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o));
    const its = itemsDeLaAccion(f, o);
    const otros = objecionesDe(f).filter(x => x.id !== o.id && planteoEnDiscusion(x)).length;
    const parcial = its.length < o.items.length;
    confirmarAccion({ titulo: "Aceptar el planteo", clase: "btn-warn", textoBoton: "Sí, reconocerlo",
      mensaje: `Vas a reconocer ${its.length} prestación(es) de ${o.id} (${o.categoria})${parcial ? ` — el planteo tiene ${o.items.length} en total` : ` por ${money(o.monto)}`}.`,
      detalle: (parcial ? `Las prestaciones que no reconozcas siguen en ${o.id} para resolverse por separado. ` : "") + (otros > 0
        ? `Queda <strong>pendiente de nota de crédito</strong>. La NC se emite una sola vez por factura: todavía ${otros === 1 ? 'hay 1 planteo' : `hay ${otros} planteos`} en discusión.`
        : "Queda reconocido y, si no queda nada en discusión, vas a poder emitir la <strong>nota de crédito consolidada</strong> de la factura."),
      onOk: () => { closeModal(); reconocerPlanteo(f, planteoDeLaAccion(f, o)); } });
  }));
  // Emisión de la NC única de la factura, que cubre todos los planteos reconocidos.
  document.querySelectorAll('[data-nc-consolidada]').forEach(el => el.addEventListener('click', () => {
    const f = state.facturas.find(x => x.nro === el.dataset.ncConsolidada); if (!f) return;
    const acreditables = planteosAcreditables(f);
    const monto = Math.min(saldoPendiente(f), acreditables.reduce((s, o) => s + o.monto, 0));
    confirmarAccion({ titulo: "Emitir la nota de crédito consolidada", clase: "btn-warn", textoBoton: "Sí, emitir NC",
      mensaje: `Vas a emitir una nota de crédito por ${money(monto)} que cubre ${acreditables.length} planteo(s) reconocido(s) de la factura ${f.nro}.`,
      detalle: `El monto se descuenta del saldo${monto >= saldoPendiente(f) ? ", que queda en cero y cierra la factura por NC" : `, que queda en ${money(saldoPendiente(f) - monto)}`}. La NC se notifica al financiador para que la reconcilie.`,
      onOk: () => { closeModal(); emitirNCConsolidada(f); } });
  }));
  $$('[data-fin-aceptar]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.finAceptar); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o));
    const its = itemsDeLaAccion(f, o);
    const parcial = its.length < o.items.length;
    confirmarAccion({ titulo: "Aceptar la respuesta", clase: "btn-success", textoBoton: "Sí, aceptar",
      mensaje: `Vas a dar por resuelto ${its.length} prestación(es) de ${o.id} (${o.categoria})${parcial ? ` — el planteo tiene ${o.items.length} en total` : ` por ${money(o.monto)}`}.`,
      detalle: `El planteo se cierra y ese monto vuelve a ser <strong>cobrable</strong>.${parcial ? ` Las prestaciones que no aceptes siguen en ${o.id}.` : ''} Los demás planteos de la factura siguen su curso.`,
      onOk: () => {
        const p = planteoDeLaAccion(f, o);
        p.estado = "aceptado";
        anotarPlanteo(f, p, { who: "financiador", nombre: "IOMA", tipo: "Respuesta aceptada",
          texto: `Aceptamos la respuesta. Damos por resuelto el planteo por ${money(p.monto)}.`,
          detalles: ["El monto vuelve a quedar reconocido y cobrable."] });
        recalcularEstadoFactura(f); closeModal(); render(); showToast(`✓ ${p.id} cerrado — ${money(p.monto)} vuelven a ser cobrables`);
      } });
  }));
  $$('[data-fin-info]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.finInfo); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o)); openModalFinRespuesta(f, o, "info");
  }));
  $$('[data-fin-sostener]').forEach(el => el.addEventListener('click', () => {
    const { f, o } = buscarPlanteo(el.dataset.finSostener); if (!o) return;
    prepararAccionPlanteo(f, o, idsDeAccion(el, o)); openModalFinRespuesta(f, o, "sostener");
  }));
  // "Ver documentación" desde una tarjeta de planteo: la factura viene en el propio atributo.
  $$('[data-ver-paciente-fact]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const [nro, pac] = el.dataset.verPacienteFact.split("|");
    openModalPaciente(nro, decodeURIComponent(pac));
  }));
}

/* Resto del cableado de la pantalla (no depende de los planteos). */
function wireEventsResto() {
  /* ---- Switch de lectura de la tabla de prestaciones ---- */
  document.querySelectorAll('[data-vista-items]').forEach(el => el.addEventListener('click', () => {
    state.vistaItems = el.dataset.vistaItems; render();
  }));
  document.querySelectorAll('[data-sel-paciente]').forEach(el => el.addEventListener('change', () => {
    const pac = decodeURIComponent(el.dataset.selPaciente);
    const ids = itemsDe(state.context.factura).filter(i => i.paciente === pac).map(i => i.id);
    state.selItems = el.checked ? [...new Set([...state.selItems, ...ids])] : state.selItems.filter(x => !ids.includes(x));
    render();
  }));
  /* ---- Auditoría central: abre la factura completa para resolver planteo por planteo ---- */
  const irAFacturaMin = (nro) => {
    if (state.context.factura !== nro) { state.selItems = []; state.filtroItems = { codigo: "TODOS", q: "" }; }
    state.view = "min_detalle_factura"; state.context.factura = nro; render();
  };
  document.querySelectorAll('[data-open-fact-min]').forEach(el => el.addEventListener('click', () => irAFacturaMin(el.dataset.openFactMin)));
  document.querySelectorAll('[data-open-fact-aud]').forEach(el => el.addEventListener('click', () => irAFacturaMin(el.dataset.openFactAud)));
  /* ---- Intimación de morosas (paso previo al acumulador judicial) ---- */
  document.querySelectorAll('[data-intimar]').forEach(el => el.addEventListener('click', () => {
    const f = state.facturas.find(x => x.nro === el.dataset.intimar); if (!f) return;
    confirmarAccion({ titulo: "Intimar al financiador", clase: "btn-danger", textoBoton: "Sí, intimar",
      mensaje: `Vas a intimar a ${finNombre(f.financiador)} por el saldo impago de la factura ${f.nro}: ${money(saldoPendiente(f))}.`,
      detalle: "La intimación se cursa por el mismo canal fehaciente que la notificación original. A partir de acá, si el pago no entra, el saldo <strong>se suma al acumulador del par</strong> y puede terminar en expediente judicial.",
      onOk: () => { intimar([f]); closeModal(); render(); showToast(`✓ ${f.nro} intimada — entra al acumulador del par`); } });
  }));
  const intimarTodas = document.querySelector('[data-intimar-todas]');
  if (intimarTodas) intimarTodas.addEventListener('click', () => {
    const pend = morosasSinIntimar();
    const monto = pend.reduce((s,f)=>s+saldoPendiente(f),0);
    confirmarAccion({ titulo: "Intimar todas las morosas", clase: "btn-danger", textoBoton: `Sí, intimar ${pend.length}`,
      mensaje: `Vas a cursar la intimación fehaciente de ${pend.length} factura(s) morosa(s) por ${money(monto)}.`,
      detalle: "Es la acción periódica de la auditoría sobre el conjunto de morosas. Las que no reciban pago pasan a acumular por par hospital–financiador.",
      onOk: () => { intimar(pend); closeModal(); render(); showToast(`✓ ${pend.length} factura(s) intimada(s)`); } });
  });
  // El pago que entra tras la intimación cierra la factura y la saca del acumulador del par.
  document.querySelectorAll('[data-pago-intimacion]').forEach(el => el.addEventListener('click', () => {
    const f = state.facturas.find(x => x.nro === el.dataset.pagoIntimacion); if (!f) return;
    confirmarAccion({ titulo: "Registrar el pago tras la intimación", clase: "btn-success", textoBoton: "Sí, entró el pago",
      mensaje: `El financiador canceló el saldo de ${f.nro}: ${money(saldoPendiente(f))}.`,
      detalle: "La factura se cierra y <strong>sale del acumulador del par</strong>, que baja en ese monto. Es la salida verde del sub-proceso de judicialización.",
      onOk: () => {
        f.montoPagado = (f.montoPagado||0) + saldoPendiente(f);
        f.estado = "cerrada";
        closeModal(); render(); showToast(`✓ ${f.nro} cerrada — sale del acumulador`);
      } });
  }));
  document.querySelectorAll('[data-gdeba]').forEach(el => el.addEventListener('click', () => openModalGDEBA(el.dataset.gdeba)));
  document.querySelectorAll('[data-ver-paquete]').forEach(el => el.addEventListener('click', () => openModalVerPaquete(el.dataset.verPaquete)));
  document.querySelectorAll('[data-confirmar-pago]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.confirmarPago; const p = state.pagosInformados.find(x => x.id === id);
    if (p) {
      p.estado = "confirmado";
      // Se imputa factura por factura según lo declarado por el financiador (brief 3.1).
      const imputaciones = p.imputaciones || p.facturas.map(nro => ({ nro, monto: p.monto }));
      imputaciones.forEach(i => {
        const f = state.facturas.find(x => x.nro === i.nro); if (!f) return;
        f.montoPagado = (f.montoPagado||0) + Math.min(i.monto, saldoPendiente(f));
        f.estado = saldoPendiente(f) <= 0 ? "cerrada" : "pago_parcial";
      });
    }
    render(); showToast("✓ Pago confirmado — imputado a las facturas");
  }));
}

/* La discusión a nivel factura completa se eliminó: toda objeción se plantea sobre prestaciones
   concretas (openModalObjetarItems), que además permite que el resto quede cobrable. */

/* ================= RESPUESTAS POR PLANTEO =================
   Antes había un único modal de descargo por factura y tres botones globales para el financiador.
   Ahora cada planteo se resuelve por separado, con la evidencia de ese planteo a la vista. */

// Encabezado común: qué se está respondiendo exactamente.
const cabeceraPlanteo = (f, o) => {
  // Solo las prestaciones que la acción va a alcanzar, no todo el planteo: si se eligieron 2 de 6,
  // el modal tiene que mostrar esas 2 y decir qué pasa con las otras 4.
  const items = itemsDeLaAccion(f, o);
  const parcial = items.length < o.items.length;
  const montoAlcanzado = items.reduce((s, i) => s + i.monto, 0);
  const totalItems = itemsDe(f.nro).filter(i => o.items.includes(i.id)).reduce((s, i) => s + i.monto, 0);
  const montoProporcional = totalItems ? Math.round(o.monto * montoAlcanzado / totalItems) : o.monto;
  return `<p class="subtle">Factura ${f.nro} · planteo <strong>${o.id}</strong> — ${o.categoria}</p>
    <div class="note" style="margin-bottom:12px;">${o.detalle}</div>
    ${items.length ? `<label>Prestaciones alcanzadas por esta decisión — ${items.length} de ${o.items.length} · ${money(montoProporcional)}</label>
    <div style="max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;">
      <table style="font-size:12px;"><tbody>${items.map(i => `<tr>
        <td>${i.paciente}<div style="color:var(--muted);font-size:11px;">DNI ${i.dni}</div></td>
        <td>${i.prestacion}</td><td><code>${i.codigo}</code></td><td style="color:var(--muted);">${i.fecha}</td><td class="money">${money(i.monto)}</td>
      </tr>`).join('')}</tbody></table>
    </div>
    ${parcial ? `<div class="note note-blue" style="margin-top:8px;">Las otras <strong>${o.items.length - items.length} prestación(es)</strong> del planteo <strong>no</strong> se ven afectadas: quedan en ${o.id} para resolverse por separado.</div>` : ''}` : ''}`;
};

/* Bloque de adjuntos de la auditoría: los tres caminos pueden acompañar documentación.

const adjuntosAuditoria = () => `
    <label>Documentación que aporta la auditoría</label>
    <div class="checkline"><input type="checkbox" class="aud-doc" value="constancia_padron.pdf" checked> Constancia de padrón con fecha y hora</div>

const docsAuditoriaElegidos = () => [...document.querySelectorAll('.aud-doc:checked')].map(c => ({ nombre: c.value, tipo: "pdf" }));

// --- Auditoría: desestimar por improcedente (vuelve al financiador con documentación) ---

/* --- Auditoría: darle la razón al financiador ---
   Distinto de derivar: acá la auditoría ya resolvió que el planteo corresponde, así que no hay nada
   que discutir. El hospital no responde, solo tiene que acreditarlo por nota de crédito. */
function openModalAudRazon(f, o) {
  openModal(`<h3>Dar la razón al financiador</h3>
    ${cabeceraPlanteo(f, o)}
    <div class="note">La objeción es procedente y la auditoría la reconoce. El planteo queda <strong>reconocido, pendiente de nota de crédito</strong>: el hospital no lo discute, solo lo acredita.</div>
    <div class="note note-blue">La NC se emite <strong>una sola vez por factura</strong>, cuando todos los planteos estén resueltos, para no generar varias notas de crédito sobre la misma factura.</div>
    <label>Fundamento del reconocimiento</label>
    <textarea id="aud-fund" placeholder="Ej: se verificó que la práctica no contaba con autorización previa y no era urgencia."></textarea>
    ${adjuntosAuditoria()}
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmarAudPlanteo('${f.nro}','${o.id}','razon')">Reconocer el planteo</button>
    </div>`);
}
window.confirmarAudPlanteo = function(nro, objId, accion) {
  const f = state.facturas.find(x => x.nro === nro); if (!f) return;
  const o0 = objecionesDe(f).find(x => x.id === objId); if (!o0) return;
  const fund = ($("#aud-fund")?.value || "").trim() || "(sin fundamento)";
  const docs = docsAuditoriaElegidos();
  // Recién acá se divide el planteo, si la decisión alcanzaba solo a parte de las prestaciones.
  const o = planteoDeLaAccion(f, o0);
  o.fundamentoAuditoria = fund; o.fechaAuditoria = HOY;
  let toast;
  if (accion === "desestimar") {
    o.estado = "respondido"; o.resolucion = "improcedente";
    state.auditoria.resueltas++;
    anotarPlanteo(f, o, { who: "ministerio", nombre: "Auditoría central — SAMO", tipo: "Objeción improcedente",
      texto: `Desestimamos el planteo y lo devolvemos al financiador. ${fund}`,
      detalles: ["Se aporta documentación que refuta la objeción.", "El hospital no interviene en este planteo."],
      adjuntos: docs });
    toast = `✓ ${o.id} desestimado — vuelve al financiador`;
  } else if (accion === "derivar") {
    o.estado = "derivado_hospital"; o.resolucion = "derivada";
    state.auditoria.derivadas++;
    anotarPlanteo(f, o, { who: "ministerio", nombre: "Auditoría central — SAMO", tipo: "Derivado al hospital",
      texto: `Derivamos el planteo al hospital para su intervención. ${fund}`,
      detalles: ["El hospital debe aportar documentación, refutar o reconocer el planteo."], adjuntos: docs });
    toast = `→ ${o.id} derivado al hospital`;
  } else {
    // Procedente: no se discute más, queda a la espera de la NC consolidada de la factura.
    o.estado = "a_acreditar"; o.resolucion = "procedente";
    state.auditoria.resueltas++;
    anotarPlanteo(f, o, { who: "ministerio", nombre: "Auditoría central — SAMO", tipo: "Objeción procedente — reconocida",
      texto: `Le damos la razón al financiador. ${fund}`,
      detalles: [`El planteo queda reconocido por ${money(o.monto)}, pendiente de nota de crédito.`,
        "La NC se emite consolidada por factura, cuando no queden planteos en discusión."], adjuntos: docs });
    toast = `${o.id} reconocido — pendiente de nota de crédito`;
  }
  recalcularEstadoFactura(f);
  closeModal(); render(); showToast(toast);
};

window.confirmarDescargoPlanteo = function(nro, objId) {

// El hospital reconoce el planteo: no se emite la NC todavía, queda a la espera de la consolidada.
function reconocerPlanteo(f, o) {

  recalcularEstadoFactura(f);

}

/* Una sola nota de crédito por factura, que cubre todos los planteos reconocidos.
   Evita emitir una NC por planteo, que del lado contable sería un lío. */
function emitirNCConsolidada(f) {
  const acreditables = planteosAcreditables(f);
  if (!acreditables.length) return;
  const monto = Math.min(saldoPendiente(f), acreditables.reduce((s, o) => s + o.monto, 0));
  const id = "NC-2026-" + String(state.notasCredito.length + 40).padStart(4, "0");
  const total = monto >= saldoPendiente(f);
  state.notasCredito.push({ id, factura: f.nro, hospital: f.hospital, financiador: f.financiador,
    monto, tipo: total ? "total" : "parcial",
    motivo: acreditables.map(o => o.categoria).join(" · "), fecha: HOY, estado: "notificada" });
  f.notasCredito = (f.notasCredito || 0) + monto;
  acreditables.forEach(o => {
    o.estado = "cerrado_nc"; o.notaCredito = id;
    anotarPlanteo(f, o, { who: "hospital", nombre: "Hosp. San Martín", tipo: "Cerrado por nota de crédito",
      texto: `Acreditado en la nota de crédito ${id}.`,
      detalles: [`NC consolidada de la factura por ${money(monto)}, que cubre ${acreditables.length} planteo(s).`],
      adjuntos: [{ nombre: `${id.toLowerCase()}.pdf`, tipo: "pdf" }] });
  });
  if (saldoPendiente(f) <= 0) f.estado = "cerrada_nc"; else recalcularEstadoFactura(f);
  render();
  showToast(`✓ ${id} emitida por ${money(monto)} — ${acreditables.length} planteo(s) cerrado(s)`);
}

window.ajustarMontoNC = function(nro) {

window.confirmarNotaCredito = function(nro) {
  const f = state.facturas.find(x => x.nro === nro); if (!f) return;
  const saldo = saldoPendiente(f);
  const tipo = $("#nc-tipo").value;
  const monto = Math.min(saldo, Math.max(0, Number($("#nc-monto").value) || 0));
  if (monto <= 0) { showToast("⚠ Indicá el monto a acreditar"); return; }
  const motivo = $("#nc-motivo").value;
  const detalle = $("#nc-detalle").value.trim();
  const id = "NC-2026-" + String(state.notasCredito.length + 40).padStart(4, "0");
  state.notasCredito.push({ id, factura: nro, hospital: f.hospital, financiador: f.financiador,
    monto, tipo, motivo, fecha: HOY, estado: "notificada" });
  f.notasCredito = (f.notasCredito || 0) + monto;
  if (tipo === "total") f.rechazoTotal = true;
  // Si la NC cancela el saldo, la factura cierra por nota de crédito (no por pago) — ver D5.
  if (saldoPendiente(f) <= 0) f.estado = "cerrada_nc";
  else if (tipo === "parcial") { f.estado = "esperando_financiador"; f.montoDebate = Math.max(0, (f.montoDebate || 0) - monto); }
  if (!state.threads[nro]) state.threads[nro] = [];
  state.threads[nro].push({ who: "hospital", nombre: "Hosp. San Martín", when: "hoy",
    text: `Emitimos la nota de crédito ${id} por ${money(monto)}.`,
    accion: { tipo: `Nota de crédito ${tipo}`, categorias: [motivo],
      detalles: [detalle || "(sin aclaración)", `Saldo de la factura tras la NC: ${money(saldoPendiente(f))}.`, "Se notifica al financiador para que la reconcilie contra la factura original."] },
    adjuntos: [{ nombre: `${id.toLowerCase()}.pdf`, tipo: "pdf" }] });
  closeModal(); render();
  showToast(`✓ ${id} emitida por ${money(monto)} — notificada a ${finNombre(f.financiador)}`);
};

window.renderFacturasPago = function() {
  const hospId = $("#pago-hospital").value;
  const facts = state.facturas.filter(f => f.financiador === "F001" && f.hospital === hospId && isImpaga(f) && f.estado !== "en_cola");
  $("#pago-facturas").innerHTML = facts.length === 0
    ? `<div style="color:var(--muted);padding:14px;text-align:center;font-size:13px;">Sin facturas impagas con este hospital.</div>`
    : facts.map(f => {
        const s = saldoPendiente(f);
        const cobrable = montoCobrable(f), debate = montoEnDebate(f);
        return `<div class="cat-item">
          <label class="cat-header">
            <input type="checkbox" class="pago-check" data-nro="${f.nro}" data-saldo="${s}">
            <span style="flex:1;"><code>${f.nro}</code> ${chip(f.estado)}${esMorosa(f) ? '' : ` <span style="font-size:11px;color:var(--muted);">${diasRestantes(f.fecha)} días</span>`}</span>
            <span style="font-family:monospace;font-size:12px;">${debate > 0 ? `Cobrable ${money(cobrable)}` : `Saldo ${money(s)}`}</span>
          </label>
          <div class="cat-body">
            <label>Importe a imputar a esta factura</label>
            <input type="number" class="pago-imputa" data-nro="${f.nro}" value="${cobrable}" max="${s}" oninput="recalcPago()">
            <div style="font-size:11px;color:var(--muted);margin-top:4px;">
              ${debate > 0
                ? `Saldo ${money(s)}, de los cuales <strong>${money(debate)} están en debate</strong>. Se propone imputar los ${money(cobrable)} reconocidos, que se pueden pagar sin esperar a que cierre la discusión.`
                : `Saldo pendiente: ${money(s)}. Imputar menos deja la factura en pago parcial — el reloj de 60 días no se renueva.`}
            </div>
          </div>
        </div>`;
      }).join('');
  document.querySelectorAll('.pago-check').forEach(cb => cb.addEventListener('change', () => {
    cb.closest('.cat-item').classList.toggle('checked', cb.checked);
    recalcPago();
  }));
  recalcPago();
};
function imputacionesSeleccionadas() {
  return [...document.querySelectorAll('.pago-check')].filter(cb => cb.checked).map(cb => {
    const nro = cb.dataset.nro;
    const input = document.querySelector(`.pago-imputa[data-nro="${nro}"]`);
    return { nro, monto: Math.max(0, Number(input?.value) || 0), saldo: Number(cb.dataset.saldo) };
  });
}
window.recalcPago = function() {
  const box = $("#pago-resumen"); if (!box) return;
  const imp = imputacionesSeleccionadas();
  const totalImputado = imp.reduce((s, i) => s + i.monto, 0);
  const declarado = Number($("#pago-monto")?.value) || 0;
  const excedido = imp.filter(i => i.monto > i.saldo);
  const descuadre = declarado > 0 && Math.abs(declarado - totalImputado) > 0.5;
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;"><span>Facturas seleccionadas</span><strong>${imp.length}</strong></div>
    <div style="display:flex;justify-content:space-between;"><span>Total imputado</span><strong style="font-family:monospace;">${money(totalImputado)}</strong></div>
    ${excedido.length ? `<div style="color:var(--danger);margin-top:6px;">⚠ ${excedido.length} imputación(es) superan el saldo de la factura.</div>` : ''}
    ${descuadre ? `<div style="color:var(--warn);margin-top:6px;">⚠ El total imputado no coincide con el monto transferido (${money(declarado)}).</div>` : ''}`;
};
window.confirmarNuevoPago = function() {
  const hospId = $("#pago-hospital").value;
  const imp = imputacionesSeleccionadas().filter(i => i.monto > 0);
  if (imp.length === 0) { showToast("⚠ Seleccioná al menos una factura e indicá el importe"); return; }
  if (imp.some(i => i.monto > i.saldo)) { showToast("⚠ Una imputación supera el saldo de la factura"); return; }
  const total = imp.reduce((s, i) => s + i.monto, 0);
  const ref = $("#pago-ref").value || "TRF-" + Math.floor(100000 + Math.random() * 899999);
  const pago = {
    id: "PAG-" + String(state.pagosInformados.length + 1).padStart(3, "0"),
    financiador: "F001", hospital: hospId,
    facturas: imp.map(i => i.nro),
    imputaciones: imp.map(i => ({ nro: i.nro, monto: i.monto })),
    monto: total,
    tipo: imp.every(i => i.monto >= i.saldo) ? "total" : "parcial",
    comprobante: ref, fecha: $("#pago-fecha").value || HOY,
    estado: "pendiente_confirmacion"
  };
  state.pagosInformados.push(pago);
  imp.forEach(i => { const f = state.facturas.find(x => x.nro === i.nro); if (f) f.estado = "pago_informado"; });

  const pefId = $("#pago-pef")?.value;

  closeModal(); render();
  showToast(`✓ Pago informado — ${money(total)} imputado a ${imp.length} factura(s) de ${hospCorto(hospId)}`);
};

  openModal(`<h3>Generar expediente judicial</h3>
    <p class="subtle">${hospCorto(hospId)} · ${finNombre(finId)} — tanda de ${facts.length} factura(s) morosa(s) por ${money(monto)} (${jus(monto).toFixed(2)} JUS).</p>
    ${previos > 0 ? `<div class="note"><strong>Este par ya tiene ${previos} expediente(s) previo(s).</strong> Este sería el N° ${previos + 1}: agrupa únicamente las morosas acumuladas desde la última tanda. Al confirmarlo, estas facturas salen del acumulador y el contador del par vuelve a cero.</div>` : `<div class="note"><strong>Primera tanda de este par.</strong> Al confirmar, estas facturas salen del acumulador y el contador vuelve a cero para la próxima.</div>`}
    <label>Facturas incluidas en la tanda</label>
    <table style="font-size:12.5px;">
      <thead><tr><th>Factura</th><th>Notificada</th><th class="money-header">Saldo</th></tr></thead>
      <tbody>${facts.map(f => `<tr><td><code>${f.nro}</code></td><td>${f.fecha}</td><td class="money">${money(saldoPendiente(f))}</td></tr>`).join('')}
        <tr><td colspan="2" style="text-align:right;font-weight:600;">Total reclamado</td><td class="money" style="font-weight:700;color:var(--danger);">${money(monto)}</td></tr></tbody>
    </table>
    <label>Paquete judicial — documentación</label>
    <div class="attachments">
      <span class="attachment-chip">📎 facturas_${facts.length}_originales.pdf</span>
      <span class="attachment-chip">📎 constancias_notificacion.pdf</span>
      <span class="attachment-chip">📎 detalle_prestaciones.xlsx</span>
      <span class="attachment-chip">📎 comprobantes_pagos_parciales.pdf</span>
      <span class="attachment-chip">📎 notas_credito.pdf</span>
    </div>
    <label>Nota modelo autocompletada</label>
    ${notaModelo({ hospital: hospId, financiador: finId, facturas: facts, monto, fecha: HOY, id: idTentativo })}
    <label>Carga en GDEBA</label>
    <select id="exp-carga">
      <option value="manual">Manual — Legales carga el expediente en GDEBA (modalidad actual)</option>
      <option value="api">Interoperable por API — alta automática en GDEBA (a futuro)</option>
    </select>
    <div class="decision-abierta" style="margin-top:8px;">
      <strong>D4 — a definir:</strong> la carga en GDEBA puede ser manual (como hoy) o interoperable por API. La decisión está abierta; el prototipo muestra ambas opciones.
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-secondary" onclick="showToast('📄 Paquete judicial generado (simulado)')">Descargar paquete PDF</button>
      <button class="btn btn-danger" onclick="confirmarExpediente('${hospId}','${finId}')">Confirmar y abrir expediente</button>
    </div>`);
}
window.confirmarExpediente = function(hospId, finId) {
  const facts = intimadasDelPar(hospId, finId);
  const monto = facts.reduce((s, f) => s + saldoPendiente(f), 0);
  if (monto < UMBRAL_MONTO) { showToast(`⚠ El par no alcanza ${UMBRAL_JUS} JUS`); return; }
  const id = "EXP-2026-" + String(state.expedientes.length + 1).padStart(4, "0");
  state.expedientes.push({
    id, hospital: hospId, financiador: finId,
    facturas: facts.map(f => f.nro), monto, fecha: HOY,
    nroGDEBA: null, cargaGDEBA: $("#exp-carga")?.value || "manual", estado: "pendiente_gdeba"
  });
  // Las facturas de la tanda salen del acumulador (el par vuelve a cero) y pasan a judicializadas.
  facts.forEach(f => { f.expediente = id; f.estado = "judicializada"; });
  closeModal();
  state.view = "expedientes"; render();
  showToast(`✓ ${id} abierto — ${facts.length} factura(s), ${money(monto)}. El acumulador del par vuelve a cero.`);
};

function openModalGDEBA(expId) {
  const e = state.expedientes.find(x => x.id === expId); if (!e) return;
  openModal(`<h3>Registrar N° de expediente GDEBA</h3>
    <p class="subtle">${e.id} — ${hospCorto(e.hospital)} · ${finNombre(e.financiador)} — ${money(e.monto)}</p>
    <div class="note note-blue">El número se asocia a <strong>todas las facturas de la tanda</strong> (${e.facturas.length}), de modo que desde cualquier factura morosa se puede ver en qué expediente está.</div>
    <label>N° de expediente GDEBA</label>
    <input id="gdeba-nro" placeholder="EX-2026-00000000-GDEBA-DPSAMOMSALGP" value="${e.nroGDEBA || ''}">
    <label>Modalidad de carga</label>
    <select id="gdeba-carga">
      <option value="manual" ${e.cargaGDEBA === 'manual' ? 'selected' : ''}>Manual</option>
      <option value="api" ${e.cargaGDEBA === 'api' ? 'selected' : ''}>Interoperable por API</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarGDEBA('${expId}')">Guardar</button>
    </div>`);
}
window.confirmarGDEBA = function(expId) {
  const e = state.expedientes.find(x => x.id === expId); if (!e) return;
  const nro = $("#gdeba-nro").value.trim();
  if (!nro) { showToast("⚠ Ingresá el N° de expediente GDEBA"); return; }
  e.nroGDEBA = nro; e.cargaGDEBA = $("#gdeba-carga").value; e.estado = "presentado";
  closeModal(); render();
  showToast(`✓ GDEBA ${nro} asociado a ${e.facturas.length} factura(s)`);
};

function openModalVerPaquete(expId) {
  const e = state.expedientes.find(x => x.id === expId); if (!e) return;
  const facts = e.facturas.map(nro => state.facturas.find(x => x.nro === nro)).filter(Boolean);
  openModal(`<h3>Paquete judicial — ${e.id}</h3>
    <p class="subtle">${hospCorto(e.hospital)} · ${finNombre(e.financiador)} — generado el ${e.fecha}</p>
    ${e.nroGDEBA ? `<div class="note note-blue"><strong>GDEBA:</strong> <span class="exp-gdeba">${e.nroGDEBA}</span> — carga ${e.cargaGDEBA}.</div>` : `<div class="note"><strong>Sin N° GDEBA todavía.</strong> Legales debe registrarlo.</div>`}
    <label>Documentación del paquete</label>
    <div class="attachments">
      <span class="attachment-chip">📎 facturas_${facts.length}_originales.pdf</span>
      <span class="attachment-chip">📎 constancias_notificacion.pdf</span>
      <span class="attachment-chip">📎 detalle_prestaciones.xlsx</span>
      <span class="attachment-chip">📎 nota_reclamo_${e.id}.pdf</span>
    </div>
    <label>Nota modelo</label>
    ${notaModelo({ hospital: e.hospital, financiador: e.financiador, facturas: facts, monto: e.monto, fecha: e.fecha, id: e.id })}
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="showToast('📄 Paquete descargado (simulado)')">Descargar PDF</button>
    </div>`);
}

document.querySelectorAll('.role-switcher button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.role-switcher button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.role = b.dataset.role;
    state.view = NAV[state.role][0].view;
    state.context = {};
    render();
  });
});

/* ===================== INICIALIZACIÓN ===================== */
/* Corre una sola vez, después de que están definidos todos los helpers. */

// 1. Prestaciones de las facturas que no vienen cargadas a mano.
FACTURAS.forEach(f => { if (!ITEMS_FACTURA[f.nro]) ITEMS_FACTURA[f.nro] = generarItems(f); });

/* 2. Migración del modelo viejo: las facturas del mock que traían `montoDebate` suelto no tenían
   planteos desagregados, así que en la nueva UI no habría nada que mostrar ni sobre qué responder.
   Se convierten en UN planteo sintético, eligiendo las prestaciones cuyo monto se acerca al debatido.
   A partir de acá `montoDebate` es solo un cache: la fuente de verdad son las objeciones. */
const CATEGORIA_POR_DEFECTO = "Documentación incompleta";
state.facturas.forEach(f => {
  if (!f.montoDebate || objecionesDe(f).length) return;
  const items = itemsDe(f.nro);
  const elegidos = []; let acum = 0;
  for (const i of items) { if (acum >= f.montoDebate) break; elegidos.push(i.id); acum += i.monto; }
  f.objeciones = [{ id: "OBJ-1", items: elegidos.length ? elegidos : items.slice(0,1).map(i=>i.id),
    categoria: CATEGORIA_POR_DEFECTO, detalle: "Planteo cargado en el mock inicial.",
    monto: f.montoDebate, fecha: f.fecha, adjuntos: [], respuestas: [] }];
});

/* 3. Estado y campos propios de cada planteo. El planteo es la unidad de trabajo: camina solo por el
   circuito y el estado de la factura se deriva de él (ver recalcularEstadoFactura). */
state.facturas.forEach(f => {
  objecionesDe(f).forEach(o => {
    /* El planteo tiene que llegarle a la auditoría tal como lo mandó el financiador: con su
       documentación de respaldo y su movimiento inicial. Sin esto, el auditor abre un planteo del
       mock y ve la categoría pero no la evidencia, que es justo lo que necesita para resolver. */
    if (!o.adjuntos || !o.adjuntos.length) {
      o.adjuntos = [{ nombre: `respaldo_${o.id.toLowerCase()}_${f.nro}.pdf`, tipo: "pdf" },
        { nombre: `detalle_prestaciones_objetadas.xlsx`, tipo: "pdf" }];
    }
    o.respuestas = o.respuestas || [];
    if (!o.respuestas.some(r => r.inicial)) {
      const its = itemsDe(f.nro).filter(i => o.items.includes(i.id));
      const pacs = [...new Set(its.map(i => i.paciente))];
      o.respuestas.unshift({ who: "financiador", nombre: finNombre(f.financiador), when: o.fecha, inicial: true,
        tipo: "Objeción planteada", texto: o.detalle, adjuntos: o.adjuntos });
      if (!state.threads[f.nro]) state.threads[f.nro] = [];
      state.threads[f.nro].unshift({ who: "financiador", nombre: finNombre(f.financiador), when: o.fecha,
        text: `[${o.id}] Objetamos ${its.length} prestación(es) de ${pacs.length} paciente(s) por ${money(o.monto)}.`,
        accion: { tipo: "Objeción por prestación", categorias: [o.categoria], detalles: [o.detalle] }, adjuntos: o.adjuntos });
    }
    if (o.estado) return;
    // Se deduce del estado en que quedó la factura en el mock.
    o.estado = f.estado === "esperando_hospital" ? "derivado_hospital"
      : f.estado === "esperando_financiador" ? "respondido"
      : "en_auditoria";
  });
});

render();
</script>
